version: '3.8'

services:
  video-wall:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bbox-video-wall
    image: anandakumar1996/bbox-vid-wall:v1.2
    
    # Use host network to access external RTSP streams
    network_mode: host
    
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
    
    # Volume mounts
    volumes:
      # Config files
      - ./config.yaml:/app/config.yaml:rw
      # Test videos for dev mode
      - ./test_videos:/app/test_videos:ro
      # Optional: persist logs
      - ./logs:/app/logs
      # Shared volume from host
      - /home/invigilo/shared_volume:/app/shared_volume:rw
      # Recordings output directory
      - /home/invigilo/recordings:/app/recordings:rw
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Security options
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  mediamtx:
    image: bluenviron/mediamtx:1.9.3-ffmpeg
    container_name: bbox-mediamtx

    # Host network so it can reach camera/DeepStream RTSP sources directly,
    # and so video-wall reaches it via 127.0.0.1 (same pattern as video-wall itself)
    network_mode: host

    volumes:
      # mediamtx rewrites this file as paths are added/removed via its API
      - ./mediamtx.yml:/mediamtx.yml:rw
      # Dev mode: mediamtx's runOnDemand ffmpeg hooks loop these into RTSP
      - ./test_videos:/app/test_videos:ro

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
